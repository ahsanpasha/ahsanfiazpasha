<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Smooth Radial Gradient Background -->
    <radialGradient id="bg" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    
    <!-- Smooth Soft Drop Shadow for Text -->
    <filter id="smooth-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>

    <!-- Gradient for the Orange Dot -->
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Modern Fine Dashed Grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />
    </pattern>
  </defs>

  <!-- Base Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="120" />
  
  <!-- Grid -->
  <rect width="512" height="512" fill="url(#grid)" rx="120" />
  
  <!-- Glassmorphism Highlight / Inner Glow Border -->
  <rect x="4" y="4" width="504" height="504" fill="none" stroke="#ffffff" stroke-width="8" rx="116" opacity="0.8" />
  
  <!-- Text (Adjusted size to 124 for perfect balance) -->
  <text x="256" y="295" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="124" letter-spacing="-2" text-anchor="middle" filter="url(#smooth-shadow)">
    <tspan fill="#0f172a">Ahsan</tspan><tspan fill="url(#dotGrad)">.</tspan>
  </text>
</svg>
